services:
  - type: web
    name: consultor-nahuatl
    runtime: python
    plan: free
    buildCommand: pip install -r api/requirements.txt && python -m modelo.entrenar
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /salud
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
